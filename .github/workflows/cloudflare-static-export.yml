name: Validate Cloudflare static export

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - integration/cloudflare-production

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /consulta
      - name: Run engine verification tests
        run: npm test
      - name: Upload static export
        uses: actions/upload-artifact@v4
        with:
          name: la-consulta-static-export
          path: out/
          if-no-files-found: error
          retention-days: 7
